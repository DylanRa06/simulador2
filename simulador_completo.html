<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema de Créditos</title>

  <link rel="stylesheet" href="simulador_completo.css">
</head>

<body>

  <header>
    <h1>Sistema Básico de Créditos</h1>
  </header>

  <nav>

    <button onclick="mostrarSeccion('parametros')">
      Parámetros
    </button>

    <button onclick="mostrarSeccion('clientes')">
      Clientes
    </button>

    <button onclick="mostrarSeccion('credito')">
      Créditos
    </button>

  </nav>


  <!-- SECCIÓN DE PARÁMETROS -->

  <section id="parametros" class="activa">

    <h2>Configurar Parámetros</h2>

    <label for="tasaInteres">
      Tasa de interés:
    </label>

    <input
      type="number"
      id="tasaInteres"
      min="10"
      max="20"
      value="15"
    >

    <span>%</span>

    <br>

    <button onclick="guardarTasa()">
      Guardar tasa
    </button>

    <p id="mensajeTasa"></p>

  </section>


  <!-- SECCIÓN DE CLIENTES -->

  <section id="clientes">

    <h2>Registro de Clientes</h2>

    <input
      type="text"
      id="cedulaCliente"
      placeholder="Cédula"
    >

    <input
      type="text"
      id="nombreCliente"
      placeholder="Nombre"
    >

    <input
      type="text"
      id="apellidoCliente"
      placeholder="Apellido"
    >

    <input
      type="number"
      id="ingresosCliente"
      placeholder="Ingresos"
    >

    <input
      type="number"
      id="egresosCliente"
      placeholder="Egresos"
    >

    <br>

    <button onclick="guardarCliente()">
      Guardar cliente
    </button>

    <button onclick="limpiar()">
      Limpiar
    </button>

    <p id="mensajeCliente"></p>

    <table>

      <thead>

        <tr>
          <th>Cédula</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Ingresos</th>
          <th>Egresos</th>
          <th>Acciones</th>
        </tr>

      </thead>

      <tbody id="tablaClientes">
      </tbody>

    </table>

  </section>


  <!-- SECCIÓN DE CRÉDITOS -->

  <section id="credito">

    <h2>Solicitar Crédito</h2>

    <label for="buscarCedulaCredito">
      Cédula del cliente:
    </label>

    <input
      type="text"
      id="buscarCedulaCredito"
      placeholder="Ingrese la cédula"
    >

    <button onclick="buscarClienteCredito()">
      Buscar cliente
    </button>

    <div id="datosClienteCredito" class="card">
    </div>

    <br>

    <label for="montoCredito">
      Monto del crédito:
    </label>

    <input
      type="number"
      id="montoCredito"
      placeholder="Ingrese el monto"
      min="1"
    >

    <label for="plazoCredito">
      Plazo en meses:
    </label>

    <input
      type="number"
      id="plazoCredito"
      placeholder="Ingrese el plazo"
      min="1"
    >

    <br>

    <button onclick="calcularCredito()">
      Calcular crédito
    </button>

    <div id="resultadoCredito">
    </div>

  </section>


  <!-- ARCHIVOS JAVASCRIPT -->

  <script src="utilitarios.js"></script>
  <script src="simulador_completo.js"></script>

</body>

</html>
